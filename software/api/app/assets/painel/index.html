<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Painel de administração do SAFE — Sistema de Acesso Facial Embarcado." />
    <meta name="color-scheme" content="dark" />
    <title>SAFE · Painel</title>
    <link rel="icon" href="safe_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Italiana&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip" href="#view">Pular para o conteúdo</a>

    <!-- Camada 1: cena 3D -->
    <canvas id="cena" aria-hidden="true"></canvas>
    <div class="fundo-estatico" aria-hidden="true"></div>

    <!-- Camada 2: grade decorativa -->
    <div class="grade" aria-hidden="true">
      <div class="grade__h"></div>
      <div class="grade__linhas">
        <div class="grade__linha"><span class="grade__ponto"></span><span class="grade__ponto"></span></div>
        <div class="grade__linha"><span class="grade__ponto"></span><span class="grade__ponto"></span></div>
        <div class="grade__linha"><span class="grade__ponto"></span><span class="grade__ponto"></span></div>
        <div class="grade__linha"><span class="grade__ponto"></span><span class="grade__ponto"></span></div>
        <div class="grade__linha"><span class="grade__ponto"></span><span class="grade__ponto"></span></div>
      </div>
    </div>

    <!-- Camada 4: barra superior -->
    <header class="topbar">
      <a class="brand" href="#/painel" aria-label="SAFE — ir para o Painel">
        <svg class="brand__mark" viewBox="0 0 40 46" aria-hidden="true">
          <path class="brand__shield" d="M20 2 37 8v14c0 11-7.4 18.6-17 22C10.4 40.6 3 33 3 22V8Z" />
          <circle class="brand__face" cx="20" cy="19" r="6.2" />
          <circle class="brand__dot" cx="17.8" cy="17.6" r="0.9" />
          <circle class="brand__dot" cx="22.2" cy="17.6" r="0.9" />
          <path class="brand__face" d="M17.4 21q2.6 2 5.2 0" />
          <path class="brand__trace" d="M13.8 19H10v-6M26.2 19H30v-6M20 25.2V31M15 31h10" />
          <circle class="brand__node" cx="10" cy="12.4" r="1.4" />
          <circle class="brand__node" cx="30" cy="12.4" r="1.4" />
          <circle class="brand__node" cx="14.6" cy="31" r="1.4" />
          <circle class="brand__node" cx="25.4" cy="31" r="1.4" />
        </svg>
        <span class="brand__name">SAFE</span>
      </a>

      <nav class="nav" aria-label="Principal">
        <a href="#/painel" data-route="painel">Painel</a>
        <span class="nav__ponto" aria-hidden="true"></span>
        <a href="#/pessoas" data-route="pessoas">Pessoas</a>
      </nav>

      <div class="topbar__fim">
        <div class="health" aria-label="Saúde do sistema">
          <span id="health-api" class="health__item"></span>
          <span id="health-db" class="health__item"></span>
        </div>
        <a class="btn-contato" href="#/pessoas/nova">Nova pessoa <span class="btn-contato__circulo" aria-hidden="true"></span></a>
      </div>
    </header>

    <!-- Progresso da jornada (preenchido pela tela Painel) -->
    <nav id="progresso" class="progresso" aria-label="Momentos da jornada" hidden></nav>

    <!-- Camada 3: conteúdo da rota -->
    <main id="view" class="view" tabindex="-1"></main>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <!-- Camada 5: cursor -->
    <div class="cursor-interno" aria-hidden="true"></div>
    <div class="cursor-externo" aria-hidden="true"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
